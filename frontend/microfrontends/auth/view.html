<!-- Microfrontend de acceso: selección de rol y formularios de login. -->
<section id="mfe-auth" class="auth">

  <div class="card auth-card">

    <button
      type="button"
      class="icon-button auth-theme theme-toggle"
      data-theme-toggle
      aria-label="Cambiar entre tema claro y oscuro"
      title="Cambiar tema"
    >
      <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
      <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
    </button>

    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true">◎</span>
      <div>
        <h1>Clicker por cámara</h1>
        <p class="hint">Votación académica en vivo</p>
      </div>
    </div>

    <div id="role-selection" class="stack">
      <h2>¿Cómo deseas ingresar?</h2>

      <div class="role-options">

        <button type="button" id="teacher-access" class="role-card">
          <span class="role-icon" aria-hidden="true">🎓</span>
          <strong>Docente</strong>
          <small>Administrar preguntas y votaciones</small>
          <span class="role-action">Ingresar</span>
        </button>

        <button type="button" id="student-access" class="role-card">
          <span class="role-icon" aria-hidden="true">👤</span>
          <strong>Estudiante</strong>
          <small>Participar en las votaciones</small>
          <span class="role-action">Ingresar</span>
        </button>

      </div>
    </div>

    <div id="teacher-login" class="stack hidden">

      <h2>Acceso docente</h2>

      <form id="login-form">
        <label for="password">Contraseña</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Entrar</button>

        <p id="login-error" class="error" role="alert"></p>
      </form>

      <button type="button" id="back-to-roles" class="secondary-button">
        Volver
      </button>

    </div>

    <div id="student-login" class="stack hidden">

      <h2>Acceso estudiante</h2>

      <form id="student-login-form">
        <label for="student-email">Correo electrónico</label>

        <input
          id="student-email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="student-password">Contraseña</label>

        <input
          id="student-password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Entrar</button>

        <p id="student-login-error" class="error" role="alert"></p>
      </form>

      <button
        type="button"
        id="back-to-roles-student"
        class="secondary-button"
      >
        Volver
      </button>

    </div>

  </div>

</section>
