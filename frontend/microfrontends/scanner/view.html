<!-- Microfrontend de escaneo QR con la cámara del dispositivo. -->
<div id="mfe-scanner">

  <section class="card scanner-card">

    <div class="card-head">
      <div>
        <p class="eyebrow">Cámara</p>
        <h2>Escanear QR con este dispositivo</h2>
      </div>

      <span id="scanner-status" class="badge offline">Detenido</span>
    </div>

    <p class="hint">
      Abre el panel desde un teléfono con HTTPS local para usar su cámara.
      Mantén cada QR quieto medio segundo; el ángulo define la opción
      (A = 0°, B = 90°, C = 180°, D = 270°).
    </p>

    <div class="scanner-stage">

      <video
        id="scanner-video"
        class="scanner-video"
        playsinline
        muted
      ></video>

      <canvas id="scanner-canvas" class="hidden"></canvas>

    </div>

    <div class="row">
      <button id="scanner-start" type="button">
        Iniciar cámara
      </button>

      <button id="scanner-stop" type="button" class="ghost" disabled>
        Detener
      </button>
    </div>

    <p id="scanner-detected" class="hint" aria-live="polite">
      Sin lecturas todavía.
    </p>

    <ul id="scanner-log" class="list scanner-log"></ul>

  </section>

</div>
