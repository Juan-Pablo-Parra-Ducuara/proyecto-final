<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#152238">
  <title>Clicker por cámara</title>

  <!-- Se carga antes del CSS para aplicar el tema sin destellos. -->
  <script src="/theme.js"></script>

  <!-- Sistema de diseño compartido por todos los microfrontends. -->
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <!-- El shell monta aquí el microfrontend activo (auth, dashboard o estudiante). -->
  <main id="app" class="app"></main>

  <!-- Notificaciones globales compartidas por los microfrontends. -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Librerías locales: sin CDN, funciona sin Internet en el aula. -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/socket.io.min.js"></script>
  <script src="/vendor/qrcode.min.js"></script>
  <script src="/vendor/jsQR.js"></script>

  <!-- Punto de entrada del host de microfrontends. -->
  <script type="module" src="/shell.js"></script>
</body>
</html>
